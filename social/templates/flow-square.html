<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Xflow — Flow — Square</title>
<style>
  /* CONCEPT: flow — Xflow's current/existing brand identity carried forward as-is. */
  :root{
    --ink:#0B2027; --paper:#EEF1EC; --paper-2:#E2E7DF; --line:#C3CBC1;
    --deep:#08181D; --accent:#1E8C8F; --accent-2:#57C2C0; --sand:#C08A44;
  }
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{width:1080px; height:1080px; overflow:hidden;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    position:relative;
  }
  .frame{
    position:absolute; inset:0;
    padding:72px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .top{display:flex; align-items:center; justify-content:space-between;}
  .wordmark{
    font-size:26px; font-weight:800; letter-spacing:-0.01em;
    color:var(--ink);
  }
  .wordmark span{color:var(--accent);}
  .badge{
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
    font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink); opacity:.6;
    border:1px solid var(--line); border-radius:999px;
    padding:8px 16px;
  }
  .accent-bar{
    width:120px; height:6px; border-radius:3px; margin-bottom:28px;
    background:linear-gradient(90deg, var(--accent), var(--sand));
  }
  .headline{
    /* REPLACE: swap this headline per post — this is a placeholder example */
    font-size:76px; font-weight:800; line-height:1.04; letter-spacing:-0.02em;
    max-width:820px;
  }
  .subhead{
    /* REPLACE: swap this subhead per post — this is a placeholder example */
    margin-top:22px;
    font-size:26px; font-weight:400; line-height:1.4; color:var(--ink); opacity:.72;
    max-width:640px;
  }
  .bottom{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:36px; border-top:1px solid var(--line);
  }
  .url{
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
    font-size:15px; color:var(--accent); font-weight:600;
  }
  .tag{
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
    font-size:13px; color:var(--ink); opacity:.5; letter-spacing:0.04em;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="wordmark">X<span>flow</span></div>
      <div class="badge">Civil &amp; Water Infrastructure</div>
    </div>
    <div>
      <div class="accent-bar"></div>
      <h1 class="headline">A new look for Xflow</h1>
      <p class="subhead">Same engineering. Refreshed identity across the site and our channels.</p>
    </div>
    <div class="bottom">
      <div class="url">xflow.co.za</div>
      <div class="tag">Quality · Trust · Innovation</div>
    </div>
  </div>
</body>
</html>
