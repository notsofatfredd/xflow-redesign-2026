<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Xflow — Ductile — Banner</title>
<style>
  /* CONCEPT: ductile — dark industrial treatment evoking cast/ductile iron pipe. */
  :root{
    --bg:#14171A; --bg-2:#1B1F23; --fg:#EDEFEC; --fg-muted:#8A9096;
    --copper:#B5773C; --line:#2A2F34;
  }
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{width:1200px; height:630px; overflow:hidden;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    position:relative;
  }
  .rings{
    position:absolute; top:-120px; right:-120px; width:420px; height:420px;
    pointer-events:none;
  }
  .rings svg{width:100%; height:100%;}
  .frame{
    position:absolute; inset:0;
    padding:60px 72px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .top{display:flex; align-items:center; justify-content:space-between;}
  .wordmark{font-size:24px; font-weight:900; letter-spacing:0.01em; text-transform:uppercase;}
  .wordmark span{color:var(--copper);}
  .badge{
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
    font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--fg-muted);
    border:1px solid var(--line); border-radius:999px;
    padding:7px 14px;
  }
  .mark{
    width:44px; height:44px; border-radius:50%;
    border:3px solid var(--copper); margin-bottom:20px;
    display:flex; align-items:center; justify-content:center;
  }
  .mark::after{content:""; width:12px; height:12px; border-radius:50%; background:var(--copper);}
  .headline{
    /* REPLACE: swap this headline per post — this is a placeholder example */
    font-size:56px; font-weight:900; line-height:1.02; letter-spacing:-0.03em;
    text-transform:uppercase; max-width:900px;
  }
  .subhead{
    /* REPLACE: swap this subhead per post — this is a placeholder example */
    margin-top:16px;
    font-size:20px; font-weight:400; line-height:1.4; color:var(--fg-muted);
    max-width:660px;
  }
  .bottom{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:24px; border-top:1px solid var(--line);
  }
  .url{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace; font-size:14px; color:var(--copper); font-weight:700; letter-spacing:0.02em;}
  .tag{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace; font-size:12px; color:var(--fg-muted); letter-spacing:0.05em;}
</style>
</head>
<body>
  <div class="rings">
    <svg viewBox="0 0 420 420" fill="none">
      <circle cx="210" cy="210" r="190" stroke="#2A2F34" stroke-width="2"/>
      <circle cx="210" cy="210" r="140" stroke="#2A2F34" stroke-width="2"/>
      <circle cx="210" cy="210" r="95" stroke="#B5773C" stroke-width="3" opacity="0.55"/>
    </svg>
  </div>
  <div class="frame">
    <div class="top">
      <div class="wordmark">X<span>FLOW</span></div>
      <div class="badge">Bulk Water &amp; Sewer</div>
    </div>
    <div>
      <div class="mark"></div>
      <h1 class="headline">Built to move water at scale</h1>
      <p class="subhead">Ductile-grade thinking behind civil, water metering and pipe infrastructure.</p>
    </div>
    <div class="bottom">
      <div class="url">xflow.co.za</div>
      <div class="tag">Quality · Trust · Innovation</div>
    </div>
  </div>
</body>
</html>
