<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Xflow — Blueprint — Square</title>
<style>
  /* CONCEPT: blueprint — light technical-drawing treatment. */
  :root{
    --paper:#F6F7F3; --ink:#0B1E33; --line:#C7CEC2;
    --grid:rgba(11,30,51,.06);
    --safety:#D9541E;
  }
  *{margin:0; padding:0; box-sizing:border-box;}
  html,body{width:1080px; height:1080px; overflow:hidden;}
  body{
    background:
      repeating-linear-gradient(0deg, var(--grid) 0, var(--grid) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, var(--grid) 0, var(--grid) 1px, transparent 1px, transparent 40px),
      var(--paper);
    color:var(--ink);
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    position:relative;
  }
  .frame{
    position:absolute; inset:0;
    padding:72px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .top{display:flex; align-items:flex-start; justify-content:space-between;}
  .wordmark{font-size:26px; font-weight:800; letter-spacing:-0.01em;}
  .ref{
    /* monospace used only for data/spec callouts, per concept spec */
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
    font-size:12px; letter-spacing:0.06em; text-align:right; line-height:1.6;
    color:var(--ink); opacity:.55;
  }
  .dims{
    display:flex; align-items:center; gap:10px; margin-bottom:24px;
  }
  .dims .tick{width:1px; height:14px; background:var(--ink); opacity:.35;}
  .dims .rule{flex:1 1 auto; height:1px; background:var(--ink); opacity:.35; max-width:180px;}
  .dims .label{
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
    font-size:12px; letter-spacing:0.06em; color:var(--ink); opacity:.55;
  }
  .headline{
    /* REPLACE: swap this headline per post — this is a placeholder example */
    font-size:74px; font-weight:800; line-height:1.05; letter-spacing:-0.015em;
    max-width:860px;
  }
  .subhead{
    /* REPLACE: swap this subhead per post — this is a placeholder example */
    margin-top:20px;
    font-size:24px; font-weight:400; line-height:1.45; color:var(--ink); opacity:.72;
    max-width:640px;
  }
  .chip{
    display:inline-flex; align-items:center; gap:8px;
    margin-top:28px; padding:9px 16px;
    border:1px solid var(--safety); border-radius:6px;
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;
    font-size:12.5px; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--safety); font-weight:600;
  }
  .chip .dot{width:6px; height:6px; background:var(--safety); border-radius:50%;}
  .bottom{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:32px; border-top:1px solid var(--ink); opacity:.9;
  }
  .bottom-inner{display:flex; align-items:center; justify-content:space-between; width:100%;}
  .url{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace; font-size:15px; color:var(--ink); font-weight:600;}
  .tag{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace; font-size:12px; color:var(--ink); opacity:.55; letter-spacing:0.04em;}
</style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="wordmark">Xflow</div>
      <div class="ref">REF: XF&#8209;2026&#8209;Q1<br>SHEET 01 / 01</div>
    </div>
    <div>
      <div class="dims">
        <div class="tick"></div><div class="rule"></div>
        <div class="label">CIVIL &amp; WATER INFRASTRUCTURE</div>
        <div class="rule"></div><div class="tick"></div>
      </div>
      <h1 class="headline">Engineered for what's next</h1>
      <p class="subhead">A technical, precise identity for pipe products, water metering and civil works.</p>
      <div class="chip"><span class="dot"></span>New profile — see site</div>
    </div>
    <div class="bottom">
      <div class="bottom-inner">
        <div class="url">xflow.co.za</div>
        <div class="tag">Restrained &amp; non-restrained products · Pressure &amp; zone management</div>
      </div>
    </div>
  </div>
</body>
</html>
